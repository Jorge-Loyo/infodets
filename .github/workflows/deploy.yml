name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 1200s
          command_timeout: 20m
          script: |
            cd ~/infodets
            git pull origin main

            # ── Backend ──────────────────────────────────────────
            cd ~/infodets/Backend
            source venv/bin/activate
            pip install -r requirements.txt -q
            alembic upgrade head || true
            # Reiniciar backend
            pkill -f 'uvicorn main:app' || true
            sleep 3
            cd ~/infodets/Backend
            source venv/bin/activate
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 >> /tmp/uvicorn.log 2>&1 &
            sleep 2
            echo "Backend desplegado ✅"

            # ── Frontend ─────────────────────────────────────────
            cd ~/infodets
            # Parar cualquier container en puerto 3000
            docker stop infodets-web 2>/dev/null || true
            docker stop infodets-frontend 2>/dev/null || true
            docker rm infodets-web 2>/dev/null || true
            docker rm infodets-frontend 2>/dev/null || true
            # Build y run
            docker build --no-cache -t infodets-frontend ./Frontend/infodets-web
            docker run -d \
              --name infodets-web \
              --restart unless-stopped \
              -p 3000:3000 \
              infodets-frontend
            # Limpiar imágenes huérfanas para liberar disco
            docker image prune -f
            echo "Frontend desplegado ✅"

            echo "Deploy completado ✅"
